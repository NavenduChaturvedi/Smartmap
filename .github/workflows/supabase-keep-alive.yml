# Keeps the Supabase project from pausing. Free-tier projects pause after
# about a week with no database activity; this runs a real (tiny) query
# through the REST API every 5 days.
#
# Requires repository secrets (Settings > Secrets and variables > Actions):
#   SUPABASE_URL       e.g. https://<project-ref>.supabase.co
#   SUPABASE_ANON_KEY  the public anon key (same as VITE_SUPABASE_ANON_KEY)
#
# Note: GitHub disables scheduled workflows in repositories with no commits
# for 60 days. If that happens, re-enable it from the Actions tab.

name: Supabase keep-alive

on:
  schedule:
    # 06:00 UTC on days 1, 6, 11, 16, 21, 26 (and 31) of each month. Cron
    # can't express "every 5 days" across month ends, but the longest gap
    # this produces is 6 days, which stays under the ~7-day pause window.
    - cron: "0 6 */5 * *"
  workflow_dispatch: {}

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query the database through the REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Set the SUPABASE_URL and SUPABASE_ANON_KEY repository secrets."
            exit 1
          fi
          # Selecting from a table (not just hitting the API root) makes
          # Postgres run a query, which is what counts as activity. Row Level
          # Security returns no rows to the anon key, which is fine.
          curl --silent --show-error --fail-with-body \
            --retry 3 --retry-delay 10 --retry-all-errors \
            --max-time 30 \
            "${SUPABASE_URL%/}/rest/v1/roadmaps?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -o /dev/null -w "Supabase responded HTTP %{http_code}\n"
